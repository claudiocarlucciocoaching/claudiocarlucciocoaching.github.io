<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invia Testimonianza | Claudio Carluccio Coaching</title>
    
    <link rel="icon" type="image/png" href="logo-claudio.png">
    <link rel="apple-touch-icon" href="logo-claudio.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        premium: { 950: '#050505', 900: '#0a0a0a', 800: '#141414', champagne: '#E5D0A1' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], serif: ['Playfair Display', 'serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { background-color: #050505; color: #f5f5f5; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
        .nav-link { position: relative; color: #a3a3a3; transition: color 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: #ffffff; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 1px; bottom: -4px; left: 0; background-color: #E5D0A1; transition: width 0.3s ease; }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        .glass-panel { background: rgba(20, 20, 20, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(229, 208, 161, 0.1); }
        .form-group-contact { margin-bottom: 24px; }
        .form-group-contact label { display: block; font-size: 11px; font-weight: 500; color: #E5D0A1; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 2px; }
        .form-control-contact {
            width: 100%; padding: 16px 20px; border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.02);
            color: #ffffff; font-size: 15px; outline: none; transition: all 0.3s ease; box-sizing: border-box;
        }
        .form-control-contact:focus { border-color: #E5D0A1; background: rgba(229, 208, 161, 0.02); }
        textarea.form-control-contact { resize: vertical; min-height: 140px; }
        .btn-contact {
            width: 100%; padding: 18px; background: transparent; border: 1px solid #E5D0A1;
            color: #E5D0A1; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px;
            cursor: pointer; transition: all 0.4s ease; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
        .btn-contact:hover { background: #E5D0A1; color: #050505; }
    </style>
</head>
<body class="antialiased font-sans selection:bg-premium-champagne selection:text-premium-950">

    <!-- HEADER / NAVBAR -->
    <header class="fixed top-0 left-0 right-0 z-[9000] py-6 px-6 md:px-12 bg-premium-950/80 backdrop-blur-2xl border-b border-white/5 transition-all duration-300">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="font-serif text-xl md:text-2xl font-semibold tracking-wider text-white hover:text-premium-champagne transition-colors cursor-pointer block">
                CLAUDIO<span class="text-premium-champagne">CARLUCCIO</span>
            </a>
            
            <nav class="hidden lg:flex items-center gap-8 text-sm font-light tracking-wide">
                <a href="index.html" class="nav-link">Home</a>
                <a href="servizi.html" class="nav-link">Servizi</a>
                <a href="area-riservata.html" class="nav-link">Area Riservata</a>
                <a href="testimonianza.html" class="nav-link active">Testimonianze</a>
                <a href="contatti.html" class="nav-link">Contattami</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow pt-32 pb-24 relative px-6">
        <div class="max-w-3xl mx-auto">
            
            <div class="text-center mb-12">
                <h1 class="font-serif text-4xl md:text-5xl font-bold text-white mb-4">La Tua Esperienza</h1>
                <p class="text-gray-400 font-light text-lg">Condividi i risultati che abbiamo raggiunto insieme. Il tuo feedback è prezioso.</p>
            </div>

            <!-- MODULO TESTIMONIANZA (FORMSUBMIT) -->
            <div class="glass-panel p-8 md:p-12 rounded-md">
                <form action="https://formsubmit.co/claudiocarlucciocoaching@gmail.com" method="POST">
                    
                    <!-- Impostazioni FormSubmit con Redirect alla pagina di Grazie -->
                    <input type="hidden" name="_subject" value="🌟 Nuova Testimonianza Ricevuta!">
                    <input type="hidden" name="_captcha" value="false">
                    <input type="hidden" name="_template" value="table">
                    <input type="hidden" name="_next" value="https://claudiocarlucciocoaching.com/grazie.html"> 
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="form-group-contact">
                            <label>Nome (o Iniziali)</label>
                            <input type="text" name="Nome" class="form-control-contact" placeholder="Es. Mario R. oppure Mario Rossi" required>
                        </div>
                        <div class="form-group-contact">
                            <label>Ruolo / Professione</label>
                            <input type="text" name="Professione" class="form-control-contact" placeholder="Es. Imprenditore, Atleta, ecc.">
                        </div>
                    </div>

                    <div class="form-group-contact">
                        <label>La tua Testimonianza</label>
                        <textarea name="Messaggio" class="form-control-contact" placeholder="Racconta la tua esperienza di coaching e i risultati che hai ottenuto..." required></textarea>
                    </div>

                    <!-- Checkbox per la Privacy e il consenso alla pubblicazione -->
                    <div class="form-group-contact bg-premium-800/40 p-4 border border-white/5 rounded mt-6">
                        <label class="flex items-start gap-3 cursor-pointer">
                            <input type="checkbox" name="Consenso_Pubblicazione" required class="mt-1 accent-[#E5D0A1]">
                            <span class="text-xs text-gray-400">Autorizzo la pubblicazione di questa testimonianza sul sito web e sui canali di Claudio Carluccio Coaching.</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-contact mt-6">
                        <span>Invia Testimonianza</span>
                        <i data-lucide="send" class="w-4 h-4"></i>
                    </button>
                </form>
            </div>
            
        </div>
    </main>

    <footer class="bg-premium-950 border-t border-white/5 py-12 px-6 text-center text-xs text-gray-500 mt-auto">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
            <a href="index.html" class="font-serif text-sm font-semibold text-white tracking-widest hover:text-premium-champagne transition-colors">
                CLAUDIO<span class="text-premium-champagne">CARLUCCIO</span>
            </a>
            <p>© 2026 Claudio Carluccio Coaching. Tutti i diritti riservati.</p>
            <div class="flex gap-6">
                <a href="contatti.html" class="hover:text-premium-champagne transition-colors">Contatti</a>
                <a href="testimonianza.html" class="hover:text-premium-champagne transition-colors">Testimonianze</a>
            </div>
        </div>
    </footer>

    <script>lucide.createIcons();</script>
</body>
</html>
