    <style>
        body { background-color: #050505; color: #f5f5f5; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }
        .ambient-glow { position: fixed; top: -150px; left: 50%; transform: translateX(-50%); width: 700px; height: 400px; background: radial-gradient(circle, rgba(229, 208, 161, 0.07) 0%, rgba(5, 5, 5, 0) 70%); pointer-events: none; z-index: 0; }
        .nav-link { position: relative; color: #a3a3a3; transition: color 0.3s ease; }
        .nav-link:hover, .nav-link.active { color: #ffffff; }
        .nav-link::after { content: ''; position: absolute; width: 0; height: 1px; bottom: -4px; left: 0; background-color: #E5D0A1; transition: width 0.3s ease; }
        .nav-link:hover::after, .nav-link.active::after { width: 100%; }
        
        .glass-panel { background: rgba(20, 20, 20, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(229, 208, 161, 0.12); }
        .hidden-step { display: none !important; }
        
        .meta-card { cursor: pointer; transition: all 0.35s ease; border: 1px solid rgba(255,255,255,0.06); }
        .meta-card:hover { transform: translateY(-4px); background: rgba(255, 255, 255, 0.03); border-color: rgba(229, 208, 161, 0.3); }

        .input-lead { 
            width: 100%; padding: 15px 18px; margin: 8px 0; box-sizing: border-box;
