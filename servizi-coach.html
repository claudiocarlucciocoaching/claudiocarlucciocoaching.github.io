<form action="https://formsubmit.co/claudiocarlucciocoaching@gmail.com" method="POST" class="max-w-md mx-auto">
    <!-- Configurazione FormSubmit -->
    <input type="hidden" name="_subject" value="📥 Nuovo Lead: Download Kit del Coach Digitale">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <!-- Reindirizzamento automatico alla guida solo dopo l'invio -->
    <input type="hidden" name="_next" value="https://claudiocarlucciocoaching.com/guida.html">

    <div class="space-y-4">
        <div>
            <label class="block text-xs uppercase tracking-widest text-[#E5D0A1] mb-1 text-left">Nome e Cognome *</label>
            <input type="text" name="Nome_Cognome" class="input-lead" placeholder="Inserisci il tuo nome" required>
        </div>
        <div>
            <label class="block text-xs uppercase tracking-widest text-[#E5D0A1] mb-1 text-left">Indirizzo Email *</label>
            <input type="email" name="Email" class="input-lead" placeholder="latua@email.com" required>
        </div>
        <div>
            <label class="block text-xs uppercase tracking-widest text-[#E5D0A1] mb-1 text-left">Numero di Telefono *</label>
            <input type="tel" name="Telefono" class="input-lead" placeholder="Il tuo numero per contatto rapido" required oninput="this.value = this.value.replace(/[^0-9+]/g, '')">
        </div>
        
        <div class="flex items-start gap-3 text-left p-3 bg-premium-900/50 rounded border border-white/5">
            <input type="checkbox" name="Privacy_GDPR" required class="mt-1 accent-[#E5D0A1] cursor-pointer">
            <span class="text-xs text-gray-400">Acconsento al trattamento dei dati personali ai sensi del GDPR per ricevere la risorsa e comunicazioni professionali. *</span>
        </div>

        <button type="submit" class="btn-gold-solid w-full mt-2">Ricevi la Guida Gratuita</button>
    </div>
</form>
